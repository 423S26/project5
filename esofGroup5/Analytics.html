<html>
  <head>
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <h1>ESC Dashboard</h1>
    <ul class="navigation">
      <li><a href="index.html">Home</a></li>
      <li><a href="Surveys.html">Surveys</a></li>
      <li><a href="Analytics.html" class="highlighted">Analytics</a></li>
      <li><a href="documentation.html">Documentation</a></li>
    </ul>
    <h2>Analytics</h2>
    <h3>Questions</h3>
    <div>
      <input
      type="text"
      id="question_search"
      placeholder="Search Questions"
      class="text_input"/>
      <select name="" id="sort_by_category">
        <option value="none">--Select type--</option>
        <option value="multiple_choice">Multiple Choice</option>
        <option value="likert">Likert / Scale</option>
        <option value="ranking">Ranking</option>
        <option value="short_answer">Short Answer</option>
        <option value="yes_no">Yes / No</option>
      </select>

    </div>
    
    <br /><br /><br />
    <div id="question_boxes" class="question_boxes"></div>
    <div class="display_box">
      <!-- Shown after questions are loaded - lets the user pick a question -->
      <!-- <div id="question-selector">
        <label for="questionSelect"><strong>Select a question:</strong></label>
        <br />
        <select id="questionSelect">
          <option value="">-- Choose a question --</option>
        </select>
      </div>

      <-- Shown after the user selects a question - preview + type assignment -->
      <div id="question-detail" style="display: none">
        <br />
        <h3 id="question-heading"></h3>

        <!-- Sample of real responses pulled from the CSV -->
        <strong>Response Preview:</strong>
        <ul id="response-preview"></ul>

        <!-- The user picks what kind of question this is -->
        <label for="typeSelect">Question Type:</label>
        <select id="typeSelect">
          <option value="">-- Select type --</option>
          <option value="multiple_choice">Multiple Choice</option>
          <option value="likert">Likert / Scale</option>
          <option value="ranking">Ranking</option>
          <option value="short_answer">Short Answer</option>
          <option value="yes_no">Yes / No</option>
        </select>

        <button id="saveTypeBtn">Save Type</button>

        <!-- Inline confirmation message after saving -->
        <span id="saveStatus"></span>

        <!-- Stats section — shown as soon as a type is selected -->
        <div id="stats-section" style="display: none">
          <hr />
          <strong>Statistics:</strong>
          <div id="stats-output"></div>
          <canvas
            id="stats-chart"
            style="max-width: 500px; margin-top: 1rem"
          ></canvas>
          <a id="chart_download" download = "chart.png" class="download_button">Download Chart</a>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/analytics.js"></script>
  </body>
</html>
